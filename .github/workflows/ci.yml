name: quality-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled manuscript
        run: test -f ARIA.pdf
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check --select E9,F63,F7,F82 .
      - run: pytest -m 'not integration'
      - run: bash -n scripts/*.sh
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test built wheel and console entry points
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          aria-data --help >/dev/null
          aria-train --help >/dev/null
          aria-infer --help >/dev/null
          aria-evaluate --help >/dev/null
          aria-ablate --help >/dev/null
          aria-counterfactual --help >/dev/null
          aria-build-bge --help >/dev/null
